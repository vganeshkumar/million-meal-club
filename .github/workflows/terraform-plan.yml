# `terraform plan` on PRs touching infra/, `terraform apply` on merge to
# main — gated by the `production` GitHub Environment, which you should
# configure with a required reviewer so a human approves every apply (see
# specs/00-constitution.md §8: apply is always a human action, never
# automatic — configure the environment's required reviewers before
# relying on this gate).
#
# Needs secrets.AWS_ROLE_ARN and vars.AWS_REGION (see deploy-frontend.yml).
# The remote state backend must already be bootstrapped (infra/README.md)
# and each envs/<env>/versions.tf backend block uncommented.

name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform fmt -check -recursive ../..
      - run: terraform plan -no-color
        continue-on-error: false

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init
      - run: terraform apply -auto-approve
