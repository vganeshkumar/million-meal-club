# Builds the Next.js static export and syncs it to S3, then invalidates
# CloudFront. Needs these repo secrets/vars set after infra/envs/<env> has
# been applied at least once (see infra/README.md):
#   secrets.AWS_ROLE_ARN            — an IAM role this workflow can assume (OIDC)
#   vars.AWS_REGION
#   vars.SITE_BUCKET_NAME           — from `terraform output` in infra/envs/<env>
#   vars.CLOUDFRONT_DISTRIBUTION_ID — from `terraform output` in infra/envs/<env>
#   vars.API_BASE_URL               — e.g. https://<distribution-domain>/api
#
# Until those are set, this workflow will fail at the "configure AWS
# credentials" step — that's expected until infra has been applied once.

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync static export to S3
        run: aws s3 sync ./out "s3://${{ vars.SITE_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
