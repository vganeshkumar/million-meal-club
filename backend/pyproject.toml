[project]
name = "backend"
version = "0.1.0"
description = "Million Meal Club API — FastAPI on Lambda"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.19",
  "boto3>=1.35",
  "pydantic>=2.9",
  "google-auth>=2.35",
  "requests>=2.32",
  "httpx>=0.27",
  "pyjwt>=2.9",
]

[dependency-groups]
dev = ["uvicorn[standard]>=0.32", "pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
